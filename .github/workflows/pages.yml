# Publishes the site to GitHub Pages (https://murilo-oppizi.github.io/eddm/) every time
# main changes: builds the static export (npm run build:pages) and deploys it.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      # Serve files as they are (Pages would otherwise skip folders starting with "_").
      - run: touch .next-pages/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .next-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
